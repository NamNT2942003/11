# Bài 4: Tối ưu hóa và Reload cấu hình không gián đoạn
# Cho phép upload file lên đến 10MB
client_max_body_size 10M;

# Cấu hình nén Gzip tối ưu tốc độ tải trang
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;

gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

gzip_disable "msie6";
